name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, check, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snapdispatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snapdispatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SNAPDISPATCH_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/snapdispatch_test
      PILOT_SESSION_SECRET: ci-session-secret-value
      PILOT_STORAGE_DIR: /tmp/snapdispatch-pilot-storage
      PILOT_FIXTURE_PASSWORD: synthetic-dev-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check demo seed
        run: npm run check

      - name: Pilot workflow tests
        run: npm run test:pilot

      - name: Build
        run: npm run build
